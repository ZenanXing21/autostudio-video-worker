name: Publish worker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check scripts and Python tests
        run: |
          bash -n start.sh scripts/start_comfyui.sh scripts/download_models.sh
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          bash tests/test_startup_debug.sh
          bash tests/test_start_comfyui_debug.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/zenanxing21/autostudio-video-worker:latest
            ghcr.io/zenanxing21/autostudio-video-worker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
